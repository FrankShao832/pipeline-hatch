# DCC Configuration
# Digital Content Creation software settings
#
# This shared file holds only PLATFORM-INDEPENDENT fields. Machine-specific
# values (executable / app_name / env_file) are provided per machine by
# config/local.yaml (git-ignored) — see config/local.yaml.example.
# Values may use ${VAR} placeholders expanded at load time (e.g. ${DEV}).

dcc:
  maya:
    name: "Maya"
    role: "maya"
    # app_name / executable / env_file: see config/local.yaml (machine-local)
    flags:
      file: "-file"
      project: "-proj"

  houdini:
    name: "Houdini"
    role: "houdini"
    # app_name / executable: see config/local.yaml (machine-local)
    env_vars:
      JOB: ""  # Set dynamically at runtime
    flags:
      file: ""

  nuke:
    name: "Nuke"
    role: "nuke"
    # app_name / executable: see config/local.yaml (machine-local)
    flags:
      nukex: "--nukex"
      file: ""
      project: "-m"

  katana:
    name: "Katana"
    role: "katana"
    # Linux-only DCC. app_name / executable live in the Linux machine's
    # config/local.yaml; macOS launchers typically disable/hide it.
    flags:
      file: ""

# Pipeline environment variables
# DCC     = application to launch (houdini/maya/nuke/katana)
# DEPARTMENT = task being worked on (fx/comp/lighting/...) — also drives the
#              working directory <seq>/<shot>/<department> and CACHE_ROOT
# PIPELINE_* names are the publisher's primary source (see publisher.core.constants)
pipeline:
  # Task vocabulary (working dirs + DEPARTMENT/PIPELINE_DEPARTMENT)
  departments:
    - fx
    - comp
    - lighting
  env_vars:
    - DCC
    - DEPARTMENT
    - CACHE_ROOT
    - PROJECT_ROOT
    - PUBLISH_ROOT
    - SHOW
    - SEQ
    - SHOT
    - PIPELINE_PROJECT
    - PIPELINE_SEQUENCE
    - PIPELINE_SHOT
    - PIPELINE_DEPARTMENT
    - PIPELINE_DCC
    - PIPELINE_USER
