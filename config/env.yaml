# Pipeline Hatch — environment overrides.
# Written by the Settings panel; a .bak.<timestamp> copy sits next to this
# file after every save. Hand edits are read, but not preserved on save.
scopes:
  show:
    Rehearsal01:
      FPS:
        description: Frame rate the show is authored at
        value: '24'
      OCIO:
        description: ACES CG colour configuration for this show
        value: ${DEV}/color/aces_cg.ocio
version: 1
